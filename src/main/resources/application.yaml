spring:
  application:
    name: shoploc-identity-service
  config:
    # ".env[.properties]" : lit le même fichier .env que "docker compose" (voir .env.example),
    # pour ne jamais avoir à exporter de variable ni à les saisir dans IntelliJ.
    import: optional:configserver:http://localhost:8888,optional:file:.env[.properties]
  security:
    oauth2:
      # Vérification des JWT reçus (signature via les clés publiques de Keycloak + émetteur)
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://localhost:8180/realms/shoploc}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:shoploc}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:shoploc-identity}
            # Même valeur par défaut que le docker-compose de Keycloak (.env.example) : ça marche
            # dès le premier lancement, même sans fichier .env.
            client-secret: ${SHOPLOC_IDENTITY_CLIENT_SECRET:123}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:shoploc}/protocol/openid-connect/token

server:
  port: 8083

shoploc:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:shoploc}
